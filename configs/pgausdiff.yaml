data:
  root: data/pgausdiff
  train_split: train
  test_split: test
  geometry_points: 200
  primitive_count: 3000
  theta_min: [0.0, 0.0, 0.001, 0.001, -3.14159, 0.05, -5.0, -5.0, 0.01]
  theta_max: [1.0, 1.0, 0.25, 0.25, 3.14159, 5.00, 5.0, 5.0, 5.00]
model:
  primitive_dim: 9
  flow_dim: 4
  embed_dim: 512
  geometry_conv_layers: 4
  condition_mlp_layers: 3
  transformer_layers: 8
  attention_heads: 8
  ffn_dim: 2048
  dropout: 0.0
diffusion:
  steps: 2000
  sample_steps: 100
  beta_start: 0.0001
  beta_end: 0.02
physics:
  gamma: 1.4
  gas_constant: 287.05
  lambda_phys: 0.1
  lambda_weak: 0.01
  lambda_bc: 1.0
  collocation_points: 10000
  control_volumes: 500
  integral_points_per_side: 4
  eps: 0.0000001
refinement:
  rounds: 3
  fine_tune_steps: 50
  split_percentile: 90.0
  split_scale: 0.5
  merge_threshold: 0.01
  distance_threshold: 0.05
  fine_tune_lr: 0.0001
  max_primitives: 6000
train:
  seed: 42
  epochs: 500
  batch_size: 32
  lr: 0.0001
  weight_decay: 0.0
  grad_clip: 1.0
  num_workers: 2
  save_every: 20
  output_dir: outputs/pgausdiff
  device: cuda
  use_physics_loss: true
  render_points_for_physics: 10000
